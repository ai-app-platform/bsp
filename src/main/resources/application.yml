spring:
  application:
    name: deposit-services-bsp
  datasource:
    url: ${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_DB_USERNAME:BSP_APP}
    password: ${ORACLE_DB_PASSWORD:change-me}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    show-sql: false
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
